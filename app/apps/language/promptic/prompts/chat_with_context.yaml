name: chat_with_context
model: openai/gpt-4o-mini
temperature: 0.7
metadata:
  id: task.chat_with_context.v1
  name: "Chat with Context"
  version: "1"
  description: |
    Answer user questions based on provided context.
    Falls back to general knowledge when context is insufficient.

system:
  personas: |
    You are a helpful assistant. The user has shared a document or content with you
    and is asking questions about it or requesting actions on it.
  constraints: |
    - Answer based on the provided context when relevant
    - If the question is not related to the context, answer from your general knowledge
    - Be concise and direct
    - Always respond in {{ language | default('auto-detect') }}
user: |
  <context>
  {{context | default('') }}
  </context>

  <question>
  {{question}}
  </question>

  <language>
  {{ language | default('auto-detect') }}
  </language>
