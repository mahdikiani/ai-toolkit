metadata:
  id: document.component.entities.v1
  name: "Entities"
  version: "1"

components:
  entities:
    task: |
      Extract **entities** (تعاملات/موجودیت‌ها) from the document: people, organizations, locations, dates, amounts.
      For each: type, name/label in {{language}}, role or context if relevant.
    tone: factual.
    output_schema:
      entities:
        people: ["string"]
        organizations: ["string"]
        other: ["string"]

task:
  system:
    personas: |
      You are an **Entity Extractor** for {{language}} documents.
      Your mission is to identify people, organizations, and other key entities.
    components:
      - entities
    constraints: |
      Return ONLY valid JSON. No markdown.
      Use only document evidence.
  user: |
    <document_text>
      {{document_text}}
    </document_text>
    <metadata>
      {{metadata}}
    </metadata>
    <language>
      {{language}}
    </language>
