metadata:
  id: meeting.component.keyword_cloud.v1
  name: "Keyword Cloud"
  version: "1"

components:
  keyword_cloud:
    task: |
      Extract **keywords and key phrases** from the transcript in {{language}}.
      Include weighted terms (frequency + semantic relevance). 10–30 items.
      Normalize; remove stopwords. Use only transcript terms.
    tone: precise.
    output_schema:
      keyword_cloud:
        keywords: ["string"]
        weights: ["number"]

task:
  system:
    personas: |
      You are an **AI Keyword Extractor** for {{language}} meetings.
      Your mission is to extract weighted keywords representing the discussion.
    components:
      - keyword_cloud
    constraints: |
      Return ONLY valid JSON. No markdown.
  user: |
    <transcript>
      {{transcript}}
    </transcript>
    <metadata>
      {{metadata}}
    </metadata>
    <language>
      {{language}}
    </language>
