metadata:
  id: meeting.component.quiz.v1
  name: "Quiz"
  version: "1"

components:
  quiz:
    task: |
      Generate **quiz questions** (کوییز) based on the meeting content in {{language}}.
      Create 3–5 questions that test understanding of key points, decisions, and outcomes.
      For each: question text, correct answer, optional distractors.
      Questions should be answerable from transcript evidence only.
    tone: clear, educational.
    output_schema:
      quiz:
        questions: ["string"]
        answers: ["string"]

task:
  system:
    personas: |
      You are an **AI Quiz Generator** for {{language}} meetings.
      Your mission is to create comprehension questions from the meeting content.
    components:
      - quiz
    constraints: |
      Return ONLY valid JSON. No markdown.
      No hallucination; questions must be answerable from transcript.
  user: |
    <transcript>
      {{transcript}}
    </transcript>
    <metadata>
      {{metadata}}
    </metadata>
    <language>
      {{language}}
    </language>
