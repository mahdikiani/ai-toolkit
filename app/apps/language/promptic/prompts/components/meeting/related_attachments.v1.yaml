metadata:
  id: meeting.component.related_attachments.v1
  name: "Related Documents & Meetings"
  version: "1"

components:
  related_attachments:
    task: |
      Identify **related documents and meetings** referenced in the transcript.
      Extract: explicit references to contracts, letters, reports, prior meetings.
      For each: short {{language}} label, identifier (number, date) if present.
      Use evidence from transcript only.
    tone: factual.
    output_schema:
      related_attachments:
        related_documents: ["string"]
        related_meetings: ["string"]

task:
  system:
    personas: |
      You are an **AI Related References Extractor** for {{language}} meetings.
      Your mission is to find references to documents and meetings mentioned in the transcript.
    components:
      - related_attachments
    constraints: |
      Return ONLY valid JSON. No markdown.
      Use only transcript evidence.
  user: |
    <transcript>
      {{transcript}}
    </transcript>
    <metadata>
      {{metadata}}
    </metadata>
    <language>
      {{language}}
    </language>
