abstract:
  abstract:
    این جلسه با هدف بررسی فرصت‌های همکاری استراتژیک بین شرکت‌های مخابراتی پاکستان (PTCL) و ایران
    (از طریق واسطه QBIC) برای ایجاد مسیرهای ترانزیت زمینی داده برگزار شد. طرفین در مورد تنوع‌بخشی به مسیرهای
    ارتباطی فراتر از کابل‌های دریایی، به‌ویژه با توجه به چالش‌های دریای سرخ، و اتصال چین به اروپا از طریق
    خاک پاکستان و ایران بحث و تبادل نظر کردند. موضوعات کلیدی شامل رفع نگرانی‌های مربوط به تحریم‌ها از
    طریق مدل تهاتر، بررسی ظرفیت‌های موجود در مرزهای تفتان و میرجاوه، و مزایای کاهش تأخیر (Latency) در
    مسیرهای زمینی نسبت به مسیرهای دریایی بود. در نهایت مقرر شد با امضای توافق‌نامه عدم افشا (NDA) و تبادل
    مستندات فنی، مقدمات تست عملیاتی شبکه و نهایی‌سازی مدل‌های تجاری در نشست‌های آتی فراهم شود.
  tone: semi_formal
  subject: توسعه زیرساخت‌های ترانزیت داده زمینی بین پاکستان، ایران و اروپا
