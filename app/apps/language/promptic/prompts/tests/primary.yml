abstract:
  این جلسه با هدف بررسی فرصت‌های همکاری استراتژیک بین شرکت‌های QBIC و PTCL در زمینه ایجاد مسیرهای
  ترانزیت داده زمینی از طریق مرزهای ایران و پاکستان برگزار شد. در این نشست، طرفین بر اهمیت تنوع‌بخشی به
  مسیرهای ارتباطی فراتر از کابل‌های دریایی (به‌ویژه با توجه به چالش‌های دریای سرخ) تأکید کردند و پتانسیل‌های
  اتصال چین به اروپا از طریق پاکستان، ایران و ترکیه را مورد بحث قرار دادند. نماینده QBIC توضیحاتی در مورد
  نحوه مدیریت تحریم‌ها از طریق مدل تهاتر و استفاده از ساختار شرکتی در امارات ارائه داد تا اطمینان لازم
  برای همکاری با اپراتور دولتی پاکستان فراهم شود. در نهایت مقرر شد با امضای توافق‌نامه عدم افشا (NDA)
  و تبادل پروفایل‌های شرکتی، گام‌های عملیاتی برای فعال‌سازی فیبرهای نوری موجود در مرز (تفتان و میرجاوه)
  و انجام تست‌های فنی آغاز گردد.
main_topic:
  label: توسعه زیرساخت‌های ترانزیت داده زمینی بین پاکستان و ایران
  rationale:
    بخش عمده گفتگو پیرامون فعال‌سازی لینک‌های فیبر نوری مرزی، ایجاد مسیر جایگزین برای کابل‌های
    دریایی و اتصال چین به اروپا از طریق خاک دو کشور بود.
outcomes:
  - description:
      توافق بر سر ارسال و امضای توافق‌نامه عدم افشا (NDA) توسط شرکت QBIC برای آغاز تبادل اطلاعات
      حساس فنی و تجاری.
  - description:
      تصمیم برای ارسال پروفایل شرکتی QBIC و سوابق فعالیت‌های بین‌المللی آن جهت بررسی بخش امتثال
      (Compliance) در شرکت PTCL.
  - description:
      برنامه‌ریزی برای انجام تست‌های فنی (Pilot) روی مسیرهای مرزی میرجاوه و میل ۲۵۰ پس از نصب
      کارت‌های DWDM مورد نیاز.
  - description:
      توافق برای برگزاری یک جلسه حضوری و پیگیری جدی‌تر در رویداد Capacity Dubai جهت نهایی کردن
      مدل‌های تجاری و تعرفه‌ها.
meeting_type_title:
  meeting_type: مذاکره استراتژیک تجاری / توسعه زیرساخت (Strategic Business Negotiation)
  meeting_title: نشست همکاری‌های زیرساختی و ترانزیت داده QBIC و PTCL
