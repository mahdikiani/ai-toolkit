[project]
name = "ai-tools"
version = "0.1.5"
description = "AI Toolkit — multi-model AI processing service: chat completions, OCR, transcription, translation, webpage extraction, YouTube transcripts, and prompt templates via OpenRouter"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "beanie>=2.1.0",
    "fastapi-mongo-base>=1.5.7",
    "httpx>=0.28.1",
    "opencv-python-headless>=4.10.0",
    "paddleocr>=3.0.0",
    "paddlepaddle>=3.2.1,<3.3",
    "paddlex[ocr]>=3.7.2",
    "pdf2image>=1.17.0",
    "pillow>=12.3.0",
    "PyMuPDF>=1.24.0",
    "scikit-learn>=1.5.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "python-magic>=0.4.27",
    "python-multipart>=0.0.32",
    "python-pptx>=1.0.2",
    "soniox-sdk>=0.1.6",
    "ufaas>=0.5.3",
    "usso>=0.31.6",
    "uvicorn>=0.51.0",
    "zstandard>=0.25.0",
]

[dependency-groups]
dev = [
    # "beanie<2",
    "hypothesis>=6.156.6",
    "ipython>=9.15.0",
    "mongomock-motor>=0.0.36",
    "mypy>=2.2.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-httpx>=0.36.2",
    "pytest-timeout>=2.4.0",
    "ruff>=0.15.21",
    "ty>=0.0.58",
    "types-aiofiles>=25.1.0.20260518",
]

[tool.ruff]
line-length = 88         # Black's default line length
target-version = "py313"
fix = true
# unsafe-fixes = true
preview = true

[tool.ruff.lint]
select = [
    "F",     # Pyflakes: critical errors and unused code
    "E",     # Pyflakes: errors
    "W",     # PEP8: formatting issues
    "I",     # isort: import sorting
    "UP",    # pyupgrade: modern syntax
    "B",     # bugbear: potential bugs
    "T",     # debugger / print statement checks
    "C",     # complexity: complexity checking
    "A",     # avoids shadowing Python built-ins
    "ASYNC", # async/await syntax
    "SIM",   # simplify: cleaner code
    "PERF",  # performance optimizations
    "TRY",   # better try/excepts
    "N",     # naming conventions
    "S",     # security checks
    "ANN",   # type annotation checks
    "T20",   # no print()
    "C4",    # comprehension: better loops
    "COM",   # enforces trailing commas where needed.
    "EXE",   # executable: executable checking
    "ISC",   # implicit string concatenation
    "G",     # misuse of logging string interpolation
    "D",     # docstrings: docstring checking
    "ERA",   # remove commented code
    "RUF",   # ruff-specific improvements
]
ignore = ["COM812", "B008", "D202", "D203", "D209", "D212", "D413"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]


[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = false
disallow_untyped_defs = false
disable_error_code = ["override"]

[tool.ty.rules]

[tool.uv.workspace]
members = [
    "test",
]
# unresolved-attribute = "ignore"
# unresolved-import = "ignore"
# division-by-zero = "warn"
# deprecated = "error"
