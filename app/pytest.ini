[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session

markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (API endpoints)
    property: Property-based tests
    document_intelligence: Document intelligence OCR submodule tests
    slow: Tests that take >1 second

addopts =
    --strict-markers
    --tb=short
    --cov=apps
    --cov=server
    --cov=utils
    --cov-report=term-missing
    --cov-report=html
    --cov-fail-under=85

filterwarnings =
    ignore:Accessing the 'model_fields' attribute on the instance is deprecated.*:pydantic.warnings.PydanticDeprecatedSince211
    # ignore:.*PydanticSerializationUnexpectedValue.*:UserWarning
    
