[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (API endpoints)
    property: Property-based tests
    slow: Tests that take >1 second
addopts =
    --strict-markers
    --tb=short
